name: Check resale tickets

on:
  schedule:
    - cron: "* * * * */5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ticket-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Check tickets
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ALERT_ROLE_ID: ${{ secrets.ALERT_ROLE_ID }}
        run: python webhook_check.py

      - name: Save state
        run: |
          git config user.name "ticket-bot"
          git config user.email "ticket-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Update ticket state" && git push)
